<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="/statics/style.css">
</head>
<body>
    <h1>Groupie Tracker</h1>
    <div class="grille"> <!--la class grille regroupe l'ensemble des cartes des artistes et leurs infos-->
        {{ range . }}
        <div class="carte1">
            <h2>{{ .Name }}</h2>
            <img src="{{ .Image }}" alt="Photo de Groupe1">
            <p>{{ .CreationDate }}</p>
            <p>{{ .Members }}</p>
            <p> {{ .FirstAlbum }}</p>
        </div>

        <div class="carte">
            <h2>Groupe2</h2>
            <img src="https://th.bing.com/th/id/OIP.hqAei3jfIpGK_41_M4BU8AHaEo?w=263&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Photo de Groupe2">
            <p>Créé en 1988</p>
        </div>

        <div class="carte">
            <h2>Groupe3</h2>
            <img src="https://th.bing.com/th/id/OIP.GmTwFUVnm3agKh-mp-LD7gHaE7?w=224&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Photo de Groupe3">
            <p>Créé en 1995</p>
        </div>

        <div class="carte">
            <h2>Groupe3</h2>
            <img src="https://th.bing.com/th/id/OIP.GmTwFUVnm3agKh-mp-LD7gHaE7?w=224&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Photo de Groupe3">
            <p>Créé en 1995</p>
        </div>

        <div class="carte">
             <h2>Groupe3</h2>

             <p>Créé en 1995</p>
         </div>

        <div class="carte">
            <h2>Groupe3</h2>
            <img src="https://th.bing.com/th/id/OIP.GmTwFUVnm3agKh-mp-LD7gHaE7?w=224&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Photo de Groupe3">
            <p>Créé en 1995</p>
        </div>
        {{ end }}
    </div>
</body>
</html>
