<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="/statics/style.css">
</head>
<header>hhh</header>
<body>
    <h1>Groupie Tracker</h1>
    <div class="grille"> <!--la class="grille" regroupe l'ensemble des cartes des artistes et leurs infos-->
        {{ range . }}
        <div class="carte">
            <h2>{{ .Name }}</h2>
            <img src="{{ .Image }}" alt="Photo du Groupe">
            <p id="date">{{ .CreationDate }}</p>
            <p>{{ .FirstAlbum }}</p>
            <p>{{ .Members }}</p>
        </div>
        {{ end }}
    </div>
</body>
</html>
